services:
  sailfish:
    build: .
    image: sailfish:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Conservative defaults suit small hosts; raise mem_limit and
    # NODE_OPTIONS max-old-space-size on larger machines.
    mem_limit: 384m
    memswap_limit: 1g
    cpus: "1.0"
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - sailfish-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  sailfish-data:
