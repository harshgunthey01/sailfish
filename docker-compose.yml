services:
  sailfish:
    build: .
    image: sailfish:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Tuned for a $4 / 512MB Droplet. On $6 / 1GB, raise mem_limit to 768m
    # and NODE_OPTIONS max-old-space-size to 384.
    mem_limit: 384m
    memswap_limit: 1g
    cpus: "1.0"
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - sailfish-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  sailfish-data:
